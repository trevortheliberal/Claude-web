name: Build lyrics APK

on:
  push:
    paths:
      - 'apple-music-lyrics/**'
      - '.github/workflows/android-lyrics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apple-music-lyrics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FullscreenLyrics.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FullscreenLyrics-apk
          path: apple-music-lyrics/FullscreenLyrics.apk

      - name: Publish as a pre-release (easy to download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lyrics-build-${{ github.run_number }}
          name: 全屏歌词 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: apple-music-lyrics/FullscreenLyrics.apk
          body: |
            Built from ${{ github.sha }} on branch ${{ github.ref_name }}.
            在手机上下载 FullscreenLyrics.apk 安装即可，安装说明见 apple-music-lyrics/README.md。
