plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fslyrics'
    compileSdk 35

    defaultConfig {
        applicationId 'app.fslyrics'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // A fixed, public key so every CI build can be installed over the previous one.
    // It is not a secret and must not be used for store releases.
    signingConfigs {
        shared {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
